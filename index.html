<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2f5d8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AIGP" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>AIGP Prep</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // last resort: if the app script itself fails to load or parse, say so instead of a blank page
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.firstChild) r.innerHTML = '<p style="font:16px -apple-system,sans-serif;padding:20px">No se pudo iniciar la app en este navegador.<br><small>' +
          String(e.message).replace(/</g, '&lt;') + '<br>' + navigator.userAgent + '</small></p>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
